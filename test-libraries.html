<!DOCTYPE html>
<html>
<head>
    <title>Library Test</title>
</head>
<body>
    <h1>Library Loading Test</h1>
    <div id="result">Checking...</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r150/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon-es/0.20.0/cannon-es.min.js"></script>

    <script>
        const result = document.getElementById('result');

        if (typeof THREE !== 'undefined') {
            result.innerHTML += '<br>✅ THREE.js loaded successfully';
            result.innerHTML += '<br>Version: ' + THREE.REVISION;
        } else {
            result.innerHTML += '<br>❌ THREE.js failed to load';
        }

        if (typeof CANNON !== 'undefined') {
            result.innerHTML += '<br>✅ Cannon-es loaded successfully';
        } else {
            result.innerHTML += '<br>❌ Cannon-es failed to load';
        }

        if (typeof THREE !== 'undefined' && typeof CANNON !== 'undefined') {
            result.innerHTML += '<br><br><strong>🎉 All libraries loaded! Game should work.</strong>';
        }
    </script>
</body>
</html>

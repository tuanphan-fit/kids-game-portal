<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crocodile Dentist - My Game World</title>
    <link rel="stylesheet" href="../../css/common.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="crocodile-container">
        <!-- Header with Back Button -->
        <header class="crocodile-header">
            <button class="btn-back" onclick="goBack()">
                <span class="arrow">←</span> Back
            </button>
            <h1 class="crocodile-title">🐊 Crocodile Dentist</h1>
            <div class="score-display">
                <span class="score-label">Safe:</span>
                <span class="score-value" id="safePresses">0</span>
            </div>
        </header>

        <!-- Instructions -->
        <div class="instructions">
            <p>👆 Tap a tooth - but careful!</p>
        </div>

        <!-- Game Area -->
        <div class="game-area">
            <!-- Crocodile Head SVG -->
            <svg viewBox="0 0 800 700" class="crocodile-svg" id="crocodile">
                <defs>
                    <!-- Green gradient for skin -->
                    <linearGradient id="skinGreen" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#2ECC71"/>
                        <stop offset="50%" style="stop-color:#27AE60"/>
                        <stop offset="100%" style="stop-color:#1E8449"/>
                    </linearGradient>

                    <!-- Darker green for depth -->
                    <linearGradient id="darkGreen" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#27AE60"/>
                        <stop offset="100%" style="stop-color:#1E8449"/>
                    </linearGradient>

                    <!-- Pink gum gradient -->
                    <linearGradient id="gumPink" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#FF6B9D"/>
                        <stop offset="100%" style="stop-color:#E91E63"/>
                    </linearGradient>

                    <!-- Tooth gradient -->
                    <radialGradient id="toothWhite" cx="50%" cy="30%" r="70%">
                        <stop offset="0%" style="stop-color:#FFFFFF"/>
                        <stop offset="100%" style="stop-color:#E8E8E8"/>
                    </radialGradient>

                    <!-- Scale pattern -->
                    <pattern id="scales" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
                        <ellipse cx="20" cy="20" rx="18" ry="12" fill="#1E8449" opacity="0.3"/>
                    </pattern>
                </defs>

                <!-- HEAD BASE -->
                <!-- Main oval head shape -->
                <ellipse cx="400" cy="350" rx="380" ry="320" fill="url(#skinGreen)" stroke="#1E8449" stroke-width="4"/>

                <!-- Scale texture overlay -->
                <ellipse cx="400" cy="350" rx="375" ry="315" fill="url(#scales)"/>

                <!-- UPPER JAW AREA -->
                <!-- Upper part of head (above mouth) -->
                <path d="M50,250 Q400,50 750,250 Q720,320 400,300 Q80,320 50,250 Z" fill="url(#darkGreen)" stroke="#1E8449" stroke-width="3"/>

                <!-- LEFT EYE -->
                <g class="eye left" id="eyeLeft">
                    <!-- White of eye -->
                    <ellipse cx="200" cy="180" rx="60" ry="55" fill="white" stroke="#1E8449" stroke-width="5"/>
                    <!-- Green rim around eye -->
                    <ellipse cx="200" cy="180" rx="68" ry="63" fill="none" stroke="#27AE60" stroke-width="8"/>
                    <!-- Pupil -->
                    <circle cx="210" cy="175" r="28" fill="#2C3E50"/>
                    <!-- Highlight -->
                    <circle cx="225" cy="160" r="12" fill="white"/>
                </g>

                <!-- RIGHT EYE -->
                <g class="eye right" id="eyeRight">
                    <ellipse cx="600" cy="180" rx="60" ry="55" fill="white" stroke="#1E8449" stroke-width="5"/>
                    <ellipse cx="600" cy="180" rx="68" ry="63" fill="none" stroke="#27AE60" stroke-width="8"/>
                    <circle cx="610" cy="175" r="28" fill="#2C3E50"/>
                    <circle cx="625" cy="160" r="12" fill="white"/>
                </g>

                <!-- EYEBROWS (for expression) -->
                <path class="eyebrow left" id="eyebrowLeft" d="M130,140 Q200,115 270,140" stroke="#1E8449" stroke-width="10" fill="none" stroke-linecap="round"/>
                <path class="eyebrow right" id="eyebrowRight" d="M530,140 Q600,115 670,140" stroke="#1E8449" stroke-width="10" fill="none" stroke-linecap="round"/>

                <!-- SNOUT/NOSE AREA -->
                <ellipse cx="400" cy="280" rx="120" ry="80" fill="url(#darkGreen)" stroke="#1E8449" stroke-width="3"/>

                <!-- NOSTRILS -->
                <ellipse cx="370" cy="280" rx="18" ry="25" fill="#0E6655" stroke="#0B5345" stroke-width="2"/>
                <ellipse cx="430" cy="280" rx="18" ry="25" fill="#0E6655" stroke="#0B5345" stroke-width="2"/>

                <!-- MOUTH OPENING - UPPER JAW -->
                <g class="upper-jaw" id="upperJaw">
                    <!-- Upper gum line (curved) -->
                    <path d="M80,380 Q400,320 720,380 L720,420 Q400,360 80,420 Z" fill="url(#gumPink)" stroke="#C2185B" stroke-width="3"/>

                    <!-- Upper teeth - generated by JS -->
                    <g id="upperTeeth" class="teeth-row upper-teeth"></g>
                </g>

                <!-- MOUTH OPENING - LOWER JAW -->
                <g class="lower-jaw" id="lowerJaw">
                    <!-- Lower jaw shape -->
                    <path d="M100,430 Q200,550 400,580 Q600,550 700,430 Q650,470 400,490 Q150,470 100,430 Z" fill="url(#skinGreen)" stroke="#1E8449" stroke-width="4"/>

                    <!-- Lower gum line -->
                    <path d="M120,440 Q400,480 680,440 L680,470 Q400,510 120,470 Z" fill="url(#gumPink)" stroke="#C2185B" stroke-width="3"/>

                    <!-- Lower teeth - generated by JS -->
                    <g id="lowerTeeth" class="teeth-row lower-teeth"></g>

                    <!-- Chin area -->
                    <ellipse cx="400" cy="550" rx="150" ry="60" fill="url(#darkGreen)" opacity="0.5"/>
                </g>
            </svg>
        </div>

        <!-- Play Again Button -->
        <button class="btn-play-again" id="playAgainBtn" onclick="resetGame()" style="display: none;">
            🔄 Play Again
        </button>

        <!-- CHOMP Message -->
        <div class="chomp-message" id="chompMessage">
            <span class="chomp-text">CHOMP! 🐊</span>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>

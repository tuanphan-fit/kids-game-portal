<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crocodile Dentist - My Game World</title>
    <link rel="stylesheet" href="../../css/common.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="crocodile-container">
        <!-- Header with Back Button -->
        <header class="crocodile-header">
            <button class="btn-back" onclick="goBack()">
                <span class="arrow">←</span> Back
            </button>
            <h1 class="crocodile-title">🐊 Crocodile Dentist</h1>
            <div class="score-display">
                <span class="score-label">Safe:</span>
                <span class="score-value" id="safePresses">0</span>
            </div>
        </header>

        <!-- Instructions -->
        <div class="instructions">
            <p>👆 Tap a tooth - but careful!</p>
        </div>

        <!-- Game Area -->
        <div class="game-area">
            <!-- Crocodile SVG -->
            <svg viewBox="0 0 800 600" class="crocodile-svg" id="crocodile">
                <!-- Upper Jaw -->
                <g class="upper-jaw" id="upperJaw">
                    <!-- Upper jaw green part -->
                    <path class="jaw-green upper" d="M100,200 Q200,150 400,150 Q600,150 700,200 L700,300 Q600,350 400,350 Q200,350 100,300 Z" />

                    <!-- Upper gum -->
                    <path class="gum" d="M120,210 Q200,170 400,170 Q600,170 680,210 L680,280 Q600,320 400,320 Q200,320 120,280 Z" />

                    <!-- Teeth will be generated by JavaScript -->
                    <g class="teeth-row upper-teeth" id="upperTeeth"></g>

                    <!-- Eyes -->
                    <g class="eyes">
                        <g class="eye left">
                            <circle cx="250" cy="220" r="35" fill="white" stroke="#2C3E50" stroke-width="3"/>
                            <circle cx="255" cy="215" r="15" fill="#2C3E50" class="pupil"/>
                            <circle cx="260" cy="210" r="5" fill="white" class="highlight"/>
                        </g>
                        <g class="eye right">
                            <circle cx="550" cy="220" r="35" fill="white" stroke="#2C3E50" stroke-width="3"/>
                            <circle cx="555" cy="215" r="15" fill="#2C3E50" class="pupil"/>
                            <circle cx="560" cy="210" r="5" fill="white" class="highlight"/>
                        </g>
                    </g>

                    <!-- Eyebrows -->
                    <path class="eyebrow left" d="M210,185 Q250,175 290,185" stroke="#2C3E50" stroke-width="4" fill="none"/>
                    <path class="eyebrow right" d="M510,185 Q550,175 590,185" stroke="#2C3E50" stroke-width="4" fill="none"/>

                    <!-- Nose -->
                    <ellipse cx="400" cy="260" rx="60" ry="30" fill="#27AE60" stroke="#1E8449" stroke-width="2"/>
                    <ellipse cx="375" cy="260" rx="12" ry="15" fill="#1E8449" class="nostril"/>
                    <ellipse cx="425" cy="260" rx="12" ry="15" fill="#1E8449" class="nostril"/>
                </g>

                <!-- Lower Jaw -->
                <g class="lower-jaw" id="lowerJaw">
                    <!-- Lower jaw green part -->
                    <path class="jaw-green lower" d="M100,350 Q200,400 400,400 Q600,400 700,350 L700,450 Q600,500 400,500 Q200,500 100,450 Z" />

                    <!-- Lower gum -->
                    <path class="gum" d="M120,360 Q200,390 400,390 Q600,390 680,360 L680,430 Q600,460 400,460 Q200,460 120,430 Z" />

                    <!-- Teeth will be generated by JavaScript -->
                    <g class="teeth-row lower-teeth" id="lowerTeeth"></g>
                </g>
            </svg>
        </div>

        <!-- Play Again Button -->
        <button class="btn-play-again" id="playAgainBtn" onclick="resetGame()" style="display: none;">
            🔄 Play Again
        </button>

        <!-- CHOMP Message -->
        <div class="chomp-message" id="chompMessage">
            <span class="chomp-text">CHOMP! 🐊</span>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>

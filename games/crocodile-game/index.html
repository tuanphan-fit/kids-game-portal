<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crocodile Dentist - My Game World</title>
    <link rel="stylesheet" href="../../css/common.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="crocodile-container">
        <!-- Header with Back Button -->
        <header class="crocodile-header">
            <button class="btn-back" onclick="goBack()">
                <span class="arrow">←</span> Back
            </button>
            <h1 class="crocodile-title">🐊 Crocodile Dentist</h1>
            <div class="score-display">
                <span class="score-label">Safe:</span>
                <span class="score-value" id="safePresses">0</span>
            </div>
        </header>

        <!-- Instructions -->
        <div class="instructions">
            <p>👆 Tap a tooth - but careful!</p>
        </div>

        <!-- Game Area -->
        <div class="game-area">
            <!-- Crocodile Head -->
            <svg viewBox="0 0 900 700" class="crocodile-svg" id="crocodile">
                <defs>
                    <!-- Green gradient for head -->
                    <linearGradient id="headGreen" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#2ECC71"/>
                        <stop offset="100%" style="stop-color:#27AE60"/>
                    </linearGradient>

                    <!-- Darker green for snout -->
                    <linearGradient id="snoutGreen" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#27AE60"/>
                        <stop offset="100%" style="stop-color:#1E8449"/>
                    </linearGradient>

                    <!-- Tooth gradient -->
                    <linearGradient id="toothWhite" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#FFFFFF"/>
                        <stop offset="100%" style="stop-color:#ECF0F1"/>
                    </linearGradient>

                    <!-- Pink gum gradient -->
                    <linearGradient id="gumPink" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#FF6B9D"/>
                        <stop offset="100%" style="stop-color:#C44569"/>
                    </linearGradient>
                </defs>

                <!-- Upper Jaw Group -->
                <g class="upper-jaw" id="upperJaw">
                    <!-- Main head shape -->
                    <ellipse cx="450" cy="280" rx="350" ry="180" fill="url(#headGreen)" stroke="#1E8449" stroke-width="4"/>

                    <!-- Snout extension -->
                    <ellipse cx="450" cy="320" rx="380" ry="100" fill="url(#snoutGreen)" stroke="#1E8449" stroke-width="4"/>

                    <!-- Scales texture -->
                    <g class="scales" opacity="0.3">
                        <ellipse cx="200" cy="250" rx="40" ry="25" fill="#1E8449"/>
                        <ellipse cx="280" cy="240" rx="45" ry="28" fill="#1E8449"/>
                        <ellipse cx="370" cy="235" rx="50" ry="30" fill="#1E8449"/>
                        <ellipse cx="470" cy="233" rx="52" ry="30" fill="#1E8449"/>
                        <ellipse cx="570" cy="235" rx="50" ry="30" fill="#1E8449"/>
                        <ellipse cx="660" cy="240" rx="45" ry="28" fill="#1E8449"/>
                        <ellipse cx="740" cy="250" rx="40" ry="25" fill="#1E8449"/>
                    </g>

                    <!-- Upper gum line -->
                    <path d="M100,310 Q450,280 800,310 L800,350 Q450,320 100,350 Z" fill="url(#gumPink)" stroke="#C44569" stroke-width="3"/>

                    <!-- Upper teeth row - generated by JS -->
                    <g id="upperTeeth" class="teeth-row upper-teeth"></g>

                    <!-- Left Eye -->
                    <g class="eye left" id="eyeLeft">
                        <ellipse cx="200" cy="200" rx="50" ry="45" fill="white" stroke="#2C3E50" stroke-width="4"/>
                        <circle cx="210" cy="195" r="22" fill="#2C3E50" class="pupil"/>
                        <circle cx="220" cy="185" r="8" fill="white" class="highlight"/>
                        <ellipse cx="200" cy="200" rx="55" ry="50" fill="none" stroke="#27AE60" stroke-width="6"/>
                    </g>

                    <!-- Right Eye -->
                    <g class="eye right" id="eyeRight">
                        <ellipse cx="700" cy="200" rx="50" ry="45" fill="white" stroke="#2C3E50" stroke-width="4"/>
                        <circle cx="710" cy="195" r="22" fill="#2C3E50" class="pupil"/>
                        <circle cx="720" cy="185" r="8" fill="white" class="highlight"/>
                        <ellipse cx="700" cy="200" rx="55" ry="50" fill="none" stroke="#27AE60" stroke-width="6"/>
                    </g>

                    <!-- Eyebrows -->
                    <path class="eyebrow left" id="eyebrowLeft" d="M140,165 Q200,150 260,165" stroke="#1E8449" stroke-width="8" fill="none" stroke-linecap="round"/>
                    <path class="eyebrow right" id="eyebrowRight" d="M640,165 Q700,150 760,165" stroke="#1E8449" stroke-width="8" fill="none" stroke-linecap="round"/>

                    <!-- Nostrils -->
                    <ellipse cx="450" cy="280" rx="15" ry="20" fill="#1E8449"/>
                    <ellipse cx="450" cy="295" rx="12" ry="8" fill="#0E6655"/>
                </g>

                <!-- Lower Jaw Group -->
                <g class="lower-jaw" id="lowerJaw">
                    <!-- Lower jaw shape -->
                    <path d="M100,380 Q200,500 450,520 Q700,500 800,380 Q700,420 450,440 Q200,420 100,380 Z" fill="url(#headGreen)" stroke="#1E8449" stroke-width="4"/>

                    <!-- Lower gum line -->
                    <path d="M120,390 Q450,430 780,390 L780,420 Q450,460 120,420 Z" fill="url(#gumPink)" stroke="#C44569" stroke-width="3"/>

                    <!-- Lower teeth row - generated by JS -->
                    <g id="lowerTeeth" class="teeth-row lower-teeth"></g>
                </g>
            </svg>
        </div>

        <!-- Play Again Button -->
        <button class="btn-play-again" id="playAgainBtn" onclick="resetGame()" style="display: none;">
            🔄 Play Again
        </button>

        <!-- CHOMP Message -->
        <div class="chomp-message" id="chompMessage">
            <span class="chomp-text">CHOMP! 🐊</span>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <!-- iOS Fullscreen Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Crocodile">

    <title>Crocodile Dentist - My Game World</title>
    <link rel="stylesheet" href="../../css/common.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="crocodile-container">
        <!-- Header with Back Button -->
        <header class="crocodile-header">
            <button class="btn-back" onclick="goBack()">
                <span class="arrow">←</span> Back
            </button>
            <h1 class="crocodile-title">🐊 Crocodile Dentist</h1>
            <div class="score-display">
                <span class="score-label">Safe:</span>
                <span class="score-value" id="safePresses">0</span>
            </div>
        </header>

        <!-- Instructions -->
        <div class="instructions">
            <p>👆 Tap a tooth - but careful!</p>
        </div>

        <!-- Game Area -->
        <div class="game-area">
            <!-- Crocodile Head SVG -->
            <svg viewBox="0 0 800 700" class="crocodile-svg" id="crocodile">
                <defs>
                    <!-- Olive/Forest green colors for crocodile -->
                    <!-- Main skin color - olive green -->
                    <linearGradient id="skinGreen" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#556B2F"/>
                        <stop offset="100%" style="stop-color:#2E4A1C"/>
                    </linearGradient>

                    <!-- Darker olive green for depth -->
                    <linearGradient id="darkGreen" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#3D5222"/>
                        <stop offset="100%" style="stop-color:#1E2E0F"/>
                    </linearGradient>

                    <!-- Pink gum color -->
                    <linearGradient id="gumPink" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#FF6B9D"/>
                        <stop offset="100%" style="stop-color:#E91E63"/>
                    </linearGradient>

                    <!-- Tooth color -->
                    <radialGradient id="toothWhite" cx="50%" cy="30%" r="70%">
                        <stop offset="0%" style="stop-color:#FFFFFF"/>
                        <stop offset="100%" style="stop-color:#E8E8E8"/>
                    </radialGradient>
                </defs>

                <!-- HEAD BASE - Elongated crocodile shape -->
                <!-- Main elongated head (not round like pig) -->
                <ellipse cx="400" cy="350" rx="380" ry="280" fill="#556B2F" stroke="#1E2E0F" stroke-width="4"/>

                <!-- UPPER JAW AREA -->
                <!-- Long snout extending to front -->
                <path d="M20,340 Q100,280 200,290 Q350,300 400,310 Q450,300 600,290 Q700,280 780,340 L750,380 Q400,340 50,380 Z" fill="#3D5222" stroke="#1E2E0F" stroke-width="3"/>

                <!-- SCUTES on head (bony plates) -->
                <g id="headScutes">
                    <!-- Center row of scutes -->
                    <path d="M280,180 L300,150 L320,180 L300,210 Z" fill="#4A5F2A" stroke="#2E4A1C" stroke-width="2"/>
                    <path d="M320,190 L340,160 L360,190 L340,220 Z" fill="#4A5F2A" stroke="#2E4A1C" stroke-width="2"/>
                    <path d="M360,200 L380,170 L400,200 L380,230 Z" fill="#4A5F2A" stroke="#2E4A1C" stroke-width="2"/>
                    <path d="M400,200 L420,170 L440,200 L420,230 Z" fill="#4A5F2A" stroke="#2E4A1C" stroke-width="2"/>
                    <path d="M440,190 L460,160 L480,190 L460,220 Z" fill="#4A5F2A" stroke="#2E4A1C" stroke-width="2"/>
                    <path d="M480,180 L500,150 L520,180 L500,210 Z" fill="#4A5F2A" stroke="#2E4A1C" stroke-width="2"/>
                </g>

                <!-- LEFT EYE - Yellow reptilian eye -->
                <g class="eye left" id="eyeLeft">
                    <!-- Eye ridge/brow (bony protrusion) -->
                    <path d="M140,130 Q200,100 260,130 L255,140 Q200,115 145,140 Z" fill="#3D5222" stroke="#1E2E0F" stroke-width="3"/>

                    <!-- Yellow/gold eye (reptilian) -->
                    <ellipse cx="200" cy="180" rx="45" ry="40" fill="#FFD700" stroke="#1E2E0F" stroke-width="4"/>

                    <!-- Vertical pupil (reptilian, not mammalian) -->
                    <ellipse cx="200" cy="180" rx="8" ry="30" fill="#000"/>

                    <!-- Highlight -->
                    <circle cx="215" cy="165" r="8" fill="white" opacity="0.6"/>
                </g>

                <!-- RIGHT EYE - Yellow reptilian eye -->
                <g class="eye right" id="eyeRight">
                    <!-- Eye ridge/brow (bony protrusion) -->
                    <path d="M540,130 Q600,100 660,130 L655,140 Q600,115 545,140 Z" fill="#3D5222" stroke="#1E2E0F" stroke-width="3"/>

                    <!-- Yellow/gold eye (reptilian) -->
                    <ellipse cx="600" cy="180" rx="45" ry="40" fill="#FFD700" stroke="#1E2E0F" stroke-width="4"/>

                    <!-- Vertical pupil (reptilian, not mammalian) -->
                    <ellipse cx="600" cy="180" rx="8" ry="30" fill="#000"/>

                    <!-- Highlight -->
                    <circle cx="615" cy="165" r="8" fill="white" opacity="0.6"/>
                </g>

                <!-- LONG SNOUT - pointed, not round -->
                <path d="M50,330 Q100,310 180,315 Q280,320 350,325 Q350,345 280,340 Q100,350 50,330 Z" fill="#3D5222" stroke="#1E2E0F" stroke-width="2"/>

                <!-- NOSTRILS at TIP of snout (crocodile feature) -->
                <ellipse cx="80" cy="325" rx="8" ry="12" fill="#0B3D0B" stroke="#062206" stroke-width="1"/>
                <ellipse cx="80" cy="342" rx="8" ry="12" fill="#0B3D0B" stroke="#062206" stroke-width="1"/>

                <!-- MOUTH OPENING - UPPER JAW (V-shaped like crocodile) -->
                <g class="upper-jaw" id="upperJaw">
                    <!-- V-shaped upper gum line -->
                    <path d="M100,390 Q400,340 700,390 L700,430 Q400,380 100,430 Z" fill="#FF6B9D" stroke="#C2185B" stroke-width="3"/>

                    <!-- Upper teeth - generated by JS -->
                    <g id="upperTeeth" class="teeth-row upper-teeth"></g>
                </g>

                <!-- MOUTH OPENING - LOWER JAW (V-shaped like crocodile) -->
                <g class="lower-jaw" id="lowerJaw">
                    <!-- V-shaped lower jaw -->
                    <path d="M120,440 Q400,500 680,440 Q640,480 400,520 Q160,480 120,440 Z" fill="#556B2F" stroke="#1E2E0F" stroke-width="4"/>

                    <!-- V-shaped lower gum line -->
                    <path d="M140,450 Q400,490 660,450 L660,480 Q400,520 140,480 Z" fill="#FF6B9D" stroke="#C2185B" stroke-width="3"/>

                    <!-- Lower teeth - generated by JS -->
                    <g id="lowerTeeth" class="teeth-row lower-teeth"></g>

                    <!-- Chin area - more pointed -->
                    <ellipse cx="400" cy="510" rx="120" ry="40" fill="#3D5222" opacity="0.7"/>
                </g>
            </svg>
        </div>

        <!-- Play Again Button -->
        <button class="btn-play-again" id="playAgainBtn" onclick="resetGame()" style="display: none;">
            🔄 Play Again
        </button>

        <!-- CHOMP Message -->
        <div class="chomp-message" id="chompMessage">
            <span class="chomp-text">CHOMP! 🐊</span>
        </div>
    </div>

    <!-- Tap to Start Overlay -->
    <div id="tapToStartOverlay" class="tap-to-start-overlay">
        <div class="tap-content">
            <div class="tap-icon">👆</div>
            <h1 class="tap-title">Tap to Start!</h1>
            <p class="tap-subtitle">Tap anywhere to play</p>
        </div>
    </div>

    <script src="../../js/navigation.js"></script>
    <script src="../../js/physics-engine.js"></script>
    <script src="app.js"></script>
</body>
</html>

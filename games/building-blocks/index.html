<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Building Blocks">

    <title>Building Blocks - My Game World</title>
    <link rel="stylesheet" href="../../css/common.css">
    <link rel="stylesheet" href="../../css/design-system.css">
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <div class="building-blocks-container">
        <!-- Full-screen 3D play area -->
        <canvas id="gameCanvas"></canvas>

        <div id="loading">Loading 3D game…</div>

        <!-- Floating top bar -->
        <header class="bb-topbar">
            <button class="bb-icon-btn" onclick="goBack()" aria-label="Back">←</button>
            <h1 class="bb-title">🧱 Building Blocks</h1>
            <div class="bb-counter"><span id="blockCount">0</span><small>/200</small></div>
        </header>

        <!-- Helpful hint that fades away -->
        <div class="bb-hint" id="bbHint">👆 Tap a shape to drop it • Drag blocks to move them</div>

        <!-- Right-side tool rail -->
        <div class="bb-tools">
            <button class="bb-tool active" id="orbitModeBtn" onclick="toggleOrbitMode()">
                <span class="ico">🔨</span><span class="lbl">Build</span>
            </button>
            <button class="bb-tool active" id="snapModeBtn" onclick="toggleSnapMode()">
                <span class="ico">🧲</span><span class="lbl">Snap</span>
            </button>
            <button class="bb-tool" id="deleteModeBtn" onclick="toggleDeleteMode()">
                <span class="ico">🗑️</span><span class="lbl">Erase</span>
            </button>
            <button class="bb-tool" onclick="showSaveModal()">
                <span class="ico">💾</span><span class="lbl">Save</span>
            </button>
            <button class="bb-tool" onclick="showLoadModal()">
                <span class="ico">📂</span><span class="lbl">Load</span>
            </button>
            <button class="bb-tool danger" onclick="resetScene()">
                <span class="ico">♻️</span><span class="lbl">Clear</span>
            </button>
        </div>

        <!-- Bottom dock: shapes + colors -->
        <div class="bb-dock">
            <div class="block-type-selector" id="blockTypeSelector"></div>
            <div class="color-palette" id="colorPalette"></div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay" style="display: none;">
    </div>

    <div class="modal" id="confirmModal" style="display: none;">
        <div class="modal-content">
            <h2 class="modal-title">⚠️ Confirm</h2>
            <p class="modal-message"></p>
            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="hideAllModals()">Cancel</button>
                <button class="btn btn-confirm btn-danger">Yes, delete it!</button>
            </div>
        </div>
    </div>

    <div class="modal" id="saveModal" style="display: none;">
        <div class="modal-content modal-large">
            <h2 class="modal-title">💾 Save Creation</h2>
            <div class="save-input-group">
                <label class="save-label">Name:</label>
                <input type="text" class="save-name-input" placeholder="Building #1" maxlength="20">
            </div>
            <div class="save-slots">
            </div>
            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="hideAllModals()">Cancel</button>
            </div>
        </div>
    </div>

    <div class="modal" id="loadModal" style="display: none;">
        <div class="modal-content modal-large">
            <h2 class="modal-title">📂 Load Creation</h2>
            <div class="load-slots">
            </div>
            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="hideAllModals()">Cancel</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
    <script src="../../js/navigation.js"></script>
    <script>
        if (typeof THREE === 'undefined') {
            alert('Error: Three.js failed to load from CDN. Please check your internet connection.');
        }
        if (typeof CANNON === 'undefined') {
            alert('Error: Cannon.js failed to load from CDN. Please check your internet connection.');
        }
    </script>
    <script src="blocks.js?v=2"></script>
    <script src="scene.js?v=2"></script>
    <script src="physics.js?v=2"></script>
    <script src="input.js?v=2"></script>
    <script src="storage.js?v=2"></script>
    <script src="ui.js?v=2"></script>
    <script src="app.js?v=2"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Toy Box">

    <title>Toy Box Builder - My Game World</title>
    <link rel="stylesheet" href="../../css/common.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="toybox-container">
        <header class="toybox-header">
            <button class="btn-back" onclick="goBack()">
                <span class="arrow">←</span> Back
            </button>
            <h1 class="toybox-title">🧸 Toy Box</h1>
            <button class="btn-reset" onclick="resetScene()">
                🗑️ Reset
            </button>
        </header>

        <div id="loading" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.5rem; color: #0277BD; font-weight: bold;">Loading 3D game...</div>
        <canvas id="gameCanvas" style="width: 100%; height: 400px;"></canvas>

        <div class="spawner-controls">
            <button class="spawn-btn" data-type="cube" onclick="spawnObject('cube')">
                <div class="spawn-icon">🟦</div>
                <span class="spawn-label">Cube</span>
            </button>
            <button class="spawn-btn" data-type="cylinder" onclick="spawnObject('cylinder')">
                <div class="spawn-icon">🟢</div>
                <span class="spawn-label">Cylinder</span>
            </button>
            <button class="spawn-btn" data-type="sphere" onclick="spawnObject('sphere')">
                <div class="spawn-icon">🟠</div>
                <span class="spawn-label">Sphere</span>
            </button>
        </div>

        <div class="instructions">
            <p>👆 Tap buttons to spawn toys, then drag them!</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
    <script src="../../js/navigation.js"></script>
    <script>
        if (typeof THREE === 'undefined') {
            alert('Error: Three.js failed to load from CDN. Please check your internet connection.');
        }
        if (typeof CANNON === 'undefined') {
            alert('Error: Cannon.js failed to load from CDN. Please check your internet connection.');
        }
    </script>
    <script src="scene.js"></script>
    <script src="physics.js"></script>
    <script src="input.js"></script>
    <script src="app.js"></script>
</body>
</html>

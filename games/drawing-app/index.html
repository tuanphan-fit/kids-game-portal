<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <!-- iOS Fullscreen Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Drawing">

    <title>Drawing App - My Game World</title>
    <link rel="stylesheet" href="../../css/common.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="drawing-container">
        <!-- Header with Back Button -->
        <header class="drawing-header">
            <button class="btn-back" id="backBtn" onclick="goBack()">
                <span class="arrow">←</span> Back
            </button>
            <h1 class="drawing-title" id="titleText">🎨 Coloring Book</h1>
            <button class="btn-back" id="homeBtn" onclick="showPictureSelection()" style="display: none;">
                🏠 Home
            </button>
        </header>

        <!-- Picture Selection Screen -->
        <div class="picture-selection" id="pictureSelection">
            <div class="selection-header">
                <h2>Choose a Picture to Color! 🖍️</h2>
                <p>Tap on any picture to start coloring!</p>
            </div>
            <div class="pictures-grid" id="picturesGrid">
                <!-- Pictures will be generated by JavaScript -->
            </div>
        </div>

        <!-- Coloring Canvas Screen -->
        <div class="coloring-screen" id="coloringScreen" style="display: none;">
            <!-- Canvas Area -->
            <div class="canvas-wrapper">
                <canvas id="drawing-canvas"></canvas>
            </div>

            <!-- Tools Section -->
            <div class="tools-section">
                <!-- Drawing Tools -->
                <div class="tool-group">
                    <h3 class="tool-label">Tools</h3>
                    <div class="tool-buttons">
                        <button class="tool-btn active" data-tool="brush" onclick="setTool('brush')" title="Brush">
                            🖌️ Brush
                        </button>
                        <button class="tool-btn" data-tool="fill" onclick="setTool('fill')" title="Fill Bucket">
                            🪣 Fill
                        </button>
                        <button class="tool-btn" data-tool="eraser" onclick="setTool('eraser')" title="Eraser">
                            🧽 Eraser
                        </button>
                    </div>
                </div>

                <!-- Color Palette -->
                <div class="tool-group">
                    <h3 class="tool-label">Colors</h3>
                    <div class="color-palette" id="colorPalette">
                        <!-- Colors will be generated by JavaScript -->
                    </div>
                </div>

                <!-- Brush Size -->
                <div class="tool-group">
                    <h3 class="tool-label">Size</h3>
                    <div class="size-control">
                        <button class="size-btn" onclick="setSize(5)" title="Small">
                            ⚫
                        </button>
                        <button class="size-btn active" onclick="setSize(15)" title="Medium">
                            ⚫⚫
                        </button>
                        <button class="size-btn" onclick="setSize(30)" title="Large">
                            ⚫⚫⚫
                        </button>
                    </div>
                </div>

                <!-- Actions -->
                <div class="tool-group">
                    <h3 class="tool-label">Actions</h3>
                    <div class="action-buttons">
                        <button class="action-btn" onclick="undo()" title="Undo">
                            ↩️ Undo
                        </button>
                        <button class="action-btn" onclick="clearCanvas()" title="Clear">
                            🗑️ Clear
                        </button>
                        <button class="action-btn" onclick="saveImage()" title="Save">
                            💾 Save
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Tap to Start Overlay -->
    <div id="tapToStartOverlay" class="tap-to-start-overlay">
        <div class="tap-content">
            <div class="tap-icon">👆</div>
            <h1 class="tap-title">Tap to Start!</h1>
            <p class="tap-subtitle">Tap anywhere to play</p>
        </div>
    </div>

    <script src="pictures.js"></script>
    <script src="../../js/navigation.js"></script>
    <script src="../../js/physics-engine.js"></script>
    <script src="app.js"></script>
</body>
</html>

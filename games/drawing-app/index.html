<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <!-- iOS Fullscreen Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Drawing">

    <title>Drawing App - My Game World</title>
    <link rel="stylesheet" href="../../css/common.css">
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
    <div class="drawing-container">
        <!-- Header with Back Button -->
        <header class="drawing-header">
            <button class="btn-back" id="backBtn" onclick="goBack()">
                <span class="arrow">←</span> Back
            </button>
            <h1 class="drawing-title" id="titleText">🎨 Coloring Book</h1>
            <button class="btn-back" id="homeBtn" onclick="showPictureSelection()" style="display: none;">
                🏠 Home
            </button>
        </header>

        <!-- Picture Selection Screen -->
        <div class="picture-selection" id="pictureSelection">
            <div class="selection-header">
                <h2>Choose a Picture to Color! 🖍️</h2>
                <p>Tap on any picture to start coloring!</p>
            </div>
            <div class="pictures-grid" id="picturesGrid">
                <!-- Pictures will be generated by JavaScript -->
            </div>
        </div>

        <!-- Coloring Canvas Screen -->
        <div class="coloring-screen" id="coloringScreen" style="display: none;">
            <!-- Canvas Area -->
            <div class="canvas-wrapper">
                <canvas id="drawing-canvas"></canvas>
            </div>

            <!-- Compact tool dock -->
            <div class="tools-section">
                <div class="color-palette" id="colorPalette">
                    <!-- Colors generated by JavaScript -->
                </div>
                <div class="tool-dock">
                    <div class="tool-cluster">
                        <button class="mini-btn tool-btn active" data-tool="brush" onclick="setTool('brush')" title="Brush">
                            <span class="mi">🖌️</span><span class="ml">Brush</span>
                        </button>
                        <button class="mini-btn tool-btn" data-tool="fill" onclick="setTool('fill')" title="Fill Bucket">
                            <span class="mi">🪣</span><span class="ml">Fill</span>
                        </button>
                        <button class="mini-btn tool-btn" data-tool="eraser" onclick="setTool('eraser')" title="Eraser">
                            <span class="mi">🧽</span><span class="ml">Eraser</span>
                        </button>
                    </div>
                    <div class="tool-cluster">
                        <button class="mini-btn size-btn" data-size="5" onclick="setSize(5)" title="Small">
                            <span class="dot dot-s"></span><span class="ml">Small</span>
                        </button>
                        <button class="mini-btn size-btn active" data-size="15" onclick="setSize(15)" title="Medium">
                            <span class="dot dot-m"></span><span class="ml">Medium</span>
                        </button>
                        <button class="mini-btn size-btn" data-size="30" onclick="setSize(30)" title="Large">
                            <span class="dot dot-l"></span><span class="ml">Large</span>
                        </button>
                    </div>
                    <div class="tool-cluster">
                        <button class="mini-btn" onclick="undo()" title="Undo">
                            <span class="mi">↩️</span><span class="ml">Undo</span>
                        </button>
                        <button class="mini-btn" onclick="clearCanvas()" title="Clear">
                            <span class="mi">🧹</span><span class="ml">Clear</span>
                        </button>
                        <button class="mini-btn" onclick="saveImage()" title="Save">
                            <span class="mi">💾</span><span class="ml">Save</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="pictures.js?v=2"></script>
    <script src="../../js/navigation.js"></script>
    <script src="../../js/physics-engine.js"></script>
    <script src="app.js?v=4"></script>
</body>
</html>

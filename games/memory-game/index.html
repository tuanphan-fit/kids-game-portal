<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <!-- iOS Fullscreen Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Memory Game">

    <title>Memory Game - My Game World</title>
    <link rel="stylesheet" href="../../css/common.css">
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <div class="memory-container">
        <!-- Header with Back Button -->
        <header class="memory-header">
            <button class="btn-back" onclick="goBack()">
                <span class="arrow">←</span> Back
            </button>
            <h1 class="memory-title">🎴 Memory Game</h1>
            <div class="score-display">
                <span class="score-label">Moves:</span>
                <span class="score-value" id="moves">0</span>
            </div>
        </header>

        <!-- Game Instructions -->
        <div class="instructions">
            <p>👆 Click the cards to find matching pairs!</p>
        </div>

        <!-- Memory Cards Grid -->
        <div class="memory-game" id="memoryGame">
            <!-- Cards will be generated by JavaScript -->
        </div>

        <!-- Win Modal -->
        <div class="win-modal" id="winModal">
            <div class="win-content">
                <h2 class="win-title">🎉 You Won! 🎉</h2>
                <p class="win-message">Amazing! You found all the pairs!</p>
                <p class="win-stats">
                    Moves: <span id="finalMoves">0</span>
                </p>
                <button class="btn-play-again" onclick="restartGame()">
                    🔄 Play Again
                </button>
            </div>
        </div>

        <!-- Celebration Particles Container -->
        <div class="particles-container" id="particlesContainer"></div>
    </div>

    <script src="../../js/navigation.js"></script>
    <script src="../../js/physics-engine.js"></script>
    <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Crocodile Dentist V2 - Kids Game Portal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-wrapper">
        <!-- Header -->
        <header class="game-header">
            <button class="back-btn" id="backBtn" aria-label="Go back">
                <span class="arrow">←</span>
                <span>Back</span>
            </button>
            <h1 class="game-title">Crocodile Dentist</h1>
            <div class="score">
                <span class="score-label">Teeth:</span>
                <span class="score-value" id="teethCount">10</span>
            </div>
        </header>

        <!-- Setup Panel - Shown before game starts -->
        <div class="setup-panel" id="setupPanel">
            <h2 class="setup-title">Choose Difficulty</h2>
            <div class="difficulty-options">
                <button class="difficulty-btn" data-teeth="8">
                    <span class="difficulty-icon">🌱</span>
                    <span class="difficulty-name">Easy</span>
                    <span class="difficulty-teeth">8 Teeth</span>
                </button>
                <button class="difficulty-btn" data-teeth="12">
                    <span class="difficulty-icon">😊</span>
                    <span class="difficulty-name">Medium</span>
                    <span class="difficulty-teeth">12 Teeth</span>
                </button>
                <button class="difficulty-btn" data-teeth="16">
                    <span class="difficulty-icon">😰</span>
                    <span class="difficulty-name">Hard</span>
                    <span class="difficulty-teeth">16 Teeth</span>
                </button>
                <button class="difficulty-btn" data-teeth="20">
                    <span class="difficulty-icon">😱</span>
                    <span class="difficulty-name">Expert</span>
                    <span class="difficulty-teeth">20 Teeth</span>
                </button>
            </div>
        </div>

        <!-- Game Area - Hidden initially -->
        <div class="game-area" id="gameArea" style="display: none;">
            <div class="instruction-banner">
                <p>Click a tooth... if it's the sore one, SNAP! 🐊</p>
            </div>

            <!-- Crocodile Mouth -->
            <div class="crocodile-container" id="crocodileContainer">
                <!-- Upper Jaw -->
                <div class="jaw upper-jaw">
                    <div class="gum"></div>
                    <div class="teeth-row upper-teeth" id="upperTeeth">
                        <!-- Teeth generated by JavaScript -->
                    </div>
                </div>

                <!-- Lower Jaw -->
                <div class="jaw lower-jaw" id="lowerJaw">
                    <div class="gum"></div>
                    <div class="teeth-row lower-teeth" id="lowerTeeth">
                        <!-- Teeth generated by JavaScript -->
                    </div>
                </div>
            </div>

            <!-- Game Over Message -->
            <div class="game-over" id="gameOver" style="display: none;">
                <h2>CHOMP! 🐊</h2>
                <p>You found the sore tooth!</p>
                <button class="restart-btn" id="restartBtn">Play Again</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Music Time - My Game World</title>
    <link rel="stylesheet" href="../../css/common.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="music-container">
        <!-- Header -->
        <header class="music-header">
            <button class="btn-back" onclick="goBack()">
                <span class="arrow">←</span> Back
            </button>
            <h1 class="music-title">🎹 Music Time</h1>
            <div class="mode-switch">
                <button class="mode-btn active" data-mode="piano" onclick="setMode('piano')">
                    🎹 Piano
                </button>
                <button class="mode-btn" data-mode="animals" onclick="setMode('animals')">
                    🐾 Animals
                </button>
            </div>
        </header>

        <!-- Instructions -->
        <div class="instructions">
            <p id="instructionText">🎵 Tap the keys to play music!</p>
        </div>

        <!-- Piano/Animal Keys Container -->
        <div class="keys-container" id="keysContainer">
            <!-- Keys will be generated by JavaScript -->
        </div>

        <!-- Visual Feedback Display -->
        <div class="note-display" id="noteDisplay">
            <span class="note-emoji" id="noteEmoji">🎵</span>
            <span class="note-name" id="noteName">Play a note!</span>
        </div>

        <!-- Auto-play Demo Button -->
        <div class="demo-section">
            <button class="demo-btn" onclick="playDemo()">
                ✨ Play Demo Song
            </button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>

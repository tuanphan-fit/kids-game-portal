<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Memory Match - Kids Game Portal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-wrapper">
        <!-- Header -->
        <header class="game-header">
            <button class="back-btn" id="backBtn" aria-label="Go back">
                <span class="arrow">←</span>
                <span>Back</span>
            </button>
            <h1 class="game-title">Memory Match</h1>
            <div class="stats">
                <span class="moves-label">Moves: </span>
                <span class="moves-count" id="movesCount">0</span>
            </div>
        </header>

        <!-- Instructions -->
        <div class="instruction-banner">
            <p>Match pairs of animal friends!</p>
        </div>

        <!-- Game Board -->
        <main class="game-board" id="gameBoard" role="grid">
            <!-- Cards generated by JavaScript -->
        </main>

        <!-- Win Modal -->
        <div class="modal-overlay" id="winModal" role="dialog" aria-labelledby="winTitle">
            <div class="modal-content">
                <h2 id="winTitle">You Won!</h2>
                <p class="modal-message">Great job finding all the pairs!</p>
                <p class="modal-stats">Moves: <span id="finalMoves">0</span></p>
                <button class="restart-btn" id="restartBtn">Play Again</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <!-- iOS Fullscreen Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Stories">

    <title>Stories - My Game World</title>
    <link rel="stylesheet" href="../../css/common.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stories-container">
        <!-- Story Selection Screen -->
        <div class="story-selection" id="storySelection">
            <header class="stories-header">
                <button class="btn-back" onclick="goBack()">
                    <span class="arrow">←</span> Back
                </button>
                <h1 class="stories-title">📖 Story Time</h1>
                <div class="spacer"></div>
            </header>

            <div class="selection-header">
                <h2>Choose a Story!</h2>
                <p>Tap on a story to begin reading</p>
            </div>

            <div class="stories-grid" id="storiesGrid">
                <!-- Stories will be generated by JavaScript -->
            </div>
        </div>

        <!-- Story Reader Screen -->
        <div class="story-reader" id="storyReader" style="display: none;">
            <header class="reader-header">
                <button class="btn-back" onclick="showStorySelection()">
                    <span class="arrow">←</span> Stories
                </button>
                <h2 class="story-title" id="currentStoryTitle"></h2>
                <div class="page-indicator">
                    <span id="currentPage">1</span> / <span id="totalPages">1</span>
                </div>
            </header>

            <div class="story-content">
                <div class="story-illustration" id="storyIllustration">
                    <!-- Illustration will be rendered here -->
                </div>

                <div class="story-text-container">
                    <p class="story-text" id="storyText"></p>
                </div>
            </div>

            <div class="story-controls">
                <button class="control-btn" id="prevBtn" onclick="previousPage()">
                    ⬅️ Back
                </button>
                <button class="control-btn primary" id="nextBtn" onclick="nextPage()">
                    Next ➡️
                </button>
            </div>

            <!-- Story Complete Screen -->
            <div class="story-complete" id="storyComplete" style="display: none;">
                <div class="complete-content">
                    <h1 class="complete-title">🎉 The End!</h1>
                    <p class="complete-message">Great job reading!</p>
                    <button class="btn-restart" onclick="restartStory()">
                        🔄 Read Again
                    </button>
                    <button class="btn-home" onclick="showStorySelection()">
                        📚 More Stories
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="../../js/navigation.js"></script>
    <script src="stories.js"></script>
    <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <!-- iOS Fullscreen Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Feed the Pet">

    <title>Feed the Pet - My Game World</title>
    <link rel="stylesheet" href="../../css/common.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="pet-container">
        <header class="pet-header">
            <button class="btn-back" onclick="goBack()">
                <span class="arrow">←</span> Back
            </button>
            <h1 class="pet-title">🍎 Feed the Pet</h1>
            <div class="score-display">
                <span class="score-label">😋</span>
                <span class="score-value" id="level">1</span>
            </div>
        </header>

        <div class="happy-bar-wrap">
            <span class="happy-label">💖</span>
            <div class="happy-bar">
                <div class="happy-bar-fill" id="happyFill"></div>
            </div>
        </div>

        <div class="pet-stage" id="petStage">
            <div class="pet" id="pet">🐱</div>
            <div class="pet-speech" id="petSpeech"></div>
        </div>

        <div class="food-tray" id="foodTray"></div>

        <div class="confetti-layer" id="confettiLayer"></div>
    </div>

    <!-- Tap to Start Overlay -->
    <div id="tapToStartOverlay" class="tap-to-start-overlay">
        <div class="tap-content">
            <div class="tap-icon">👆</div>
            <h1 class="tap-title">Tap to Start!</h1>
            <p class="tap-subtitle">Tap food to feed the hungry kitty!</p>
        </div>
    </div>

    <script src="../../js/navigation.js"></script>
    <script src="app.js"></script>
</body>
</html>
